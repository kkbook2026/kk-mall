# DIEU PHOI LICH - lop du phong. Nhip chinh do buoc cuoi cua moi quy trinh (collector/scheduler.js --self ...) va collector/kick.js giu;
# quy trinh nay chi de KHOI DONG LAI khi chuoi dut (vd may chay bi ngat giua chung nen buoc cuoi khong chay). Cron cua GitHub bo / tre nhieu luot
# nen dat day 10 phut/lan; moi luot chi ~20 giay: doc lan chay gan nhat cua tung quy trinh, goi chay quy trinh den han, khong lam gi khac.
name: Scheduler - dieu phoi lich (du phong)
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: scheduler
  cancel-in-progress: true
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: collector/scheduler.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Goi chay cac quy trinh den han
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_CHAIN: ${{ vars.SEARCH_CHAIN }}
          HUNT_VN_RUNNER: ${{ vars.HUNT_VN_RUNNER }}
        run: node collector/scheduler.js
