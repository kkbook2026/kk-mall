# THU THAP HANG HOA & GIA TU DONG - chay tren may chu dam may cua GitHub
# moi 30 phut, 24/7, KHONG phu thuoc may tinh / trinh duyet cua chu shop.
name: Auto collect prices (30 min)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Gui toan bo URL cho IndexNow (Bing, Yandex...)'
        required: false
        default: 'false'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Thu thap & tinh gia (cau hinh noi bo tu Secrets)
        env:
          PRICING_OFFSET: ${{ secrets.PRICING_OFFSET }}
          ADMIN_PORTAL_KEY: ${{ secrets.ADMIN_PORTAL_KEY }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          TIKI_CLIENT_ID: ${{ secrets.TIKI_CLIENT_ID }}
          TIKI_CLIENT_SECRET: ${{ secrets.TIKI_CLIENT_SECRET }}
          SENDO_FEED_URL: ${{ secrets.SENDO_FEED_URL }}
          ACCESSTRADE_KEY: ${{ secrets.ACCESSTRADE_KEY }}  # access key AccessTrade (pub.accesstrade.vn/accounts/profile)
          ACCESSTRADE_DOMAINS: ${{ vars.ACCESSTRADE_DOMAINS }}
          FEED_URLS: ${{ secrets.FEED_URLS }}            # datafeed chinh thuc: moi dong <ma-nguon>|<url>
          FEED_MAX_TOTAL: ${{ vars.FEED_MAX_TOTAL || '30000' }}  # tran tong so SP nap tu feed
          FEED_MAX_NEW: ${{ vars.FEED_MAX_NEW || '5000' }}      # tran SP moi moi lan chay
        run: node collector/collect.js
      - name: Luu du lieu moi (giu lich su gon - amend 1 commit du lieu)
        run: |
          git config user.name "kk-mall-bot"
          git config user.email "bot@kk-mall.com"
          git add site/api site/admin/data.enc
          [ -f collector/feed-index.json ] && git add collector/feed-index.json || true
          if git diff --cached --quiet; then echo "Khong co thay doi"; exit 0; fi
          LAST=$(git log -1 --pretty=%s)
          if [ "$LAST" = "auto-data: cap nhat gia & ton kho" ]; then
            git commit --amend -m "auto-data: cap nhat gia & ton kho"
            git push -f origin main
          else
            git commit -m "auto-data: cap nhat gia & ton kho"
            git push origin main
          fi
      - name: SEO - sinh trang tinh SP/nganh/nhom + sitemap (khong commit)
        run: node collector/build-seo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: IndexNow - bao Bing/Yandex... trang vua thay doi
        if: success()
        continue-on-error: true
        env:
          INDEXNOW_ALL: ${{ github.event.inputs.indexnow_all }}
        run: node collector/indexnow.js
