name: Monitor KK-MALL (30 phut)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write   # doc nhip cac quy trinh tu dong + dieu phoi lich (collector/scheduler.js)
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            collector/monitor.js
            collector/scheduler.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Kiem tra he thong that tu ben ngoai
        id: mon
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}   # chi doc lan chay gan nhat cua cac quy trinh tu dong
        run: node collector/monitor.js
      - name: Mo / cap nhat / dong Issue canh bao
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.mon.outcome }}
        run: |
          TITLE="🚨 Giám sát KK-MALL: hệ thống có lỗi"
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number' || true)
          # Bao ve dien thoai: Issue giao cho chu kho ma (GitHub gui email + day thong bao app GitHub Mobile).
          # Chi binh luan khi danh sach kiem tra loi THAY DOI (khong bao lap moi 30 phut); het loi -> binh luan + dong.
          SIG=$(cat monitor-sig.txt 2>/dev/null || true)
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$NUM" ]; then
              LAST=$(gh issue view "$NUM" -R "$GITHUB_REPOSITORY" --json body,comments -q '([.body] + [.comments[].body]) | map(select(test("kk-sig:"))) | last // ""' | sed -n 's/.*kk-sig: \(.*\) -->.*/\1/p' | tail -1)
              if [ "$LAST" != "$SIG" ]; then gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body-file monitor-report.md
              else echo "Loi khong doi ($SIG) - khong bao lap"; fi
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file monitor-report.md --assignee "$GITHUB_REPOSITORY_OWNER" \
                || gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file monitor-report.md
            fi
            exit 1
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body-file monitor-report.md && gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --reason completed
          fi
      - name: Dieu phoi lich - goi cac quy trinh den han (cron cua GitHub bo / tre phan lon luot)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KK_JOB_STATUS: ${{ job.status }}
          SEARCH_CHAIN: ${{ vars.SEARCH_CHAIN }}
          HUNT_VN_RUNNER: ${{ vars.HUNT_VN_RUNNER }}
        run: KK_RUN_START=$(cat "$RUNNER_TEMP/kk-start" 2>/dev/null || echo 0) node collector/scheduler.js --self monitor.yml
