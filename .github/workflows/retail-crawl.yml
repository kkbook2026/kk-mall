# THU THAP GIA CONG KHAI WEBSITE BAN LE (Hoang Ha Mobile, Phuc Anh, An Phat) - moi gio, toi da 150 phut
# (An Phat yeu cau cach 5 giay/trang, ~14.000 trang: 45 phut/lan + lich GitHub thuc te chi chay 3-4 lan/ngay => 7,5 ngay moi het 1 vong,
#  gia cu hon han muc 7 ngay. 150 phut/lan => ~2 ngay/vong, van dung Crawl-delay cua tung website.)
# Tuan thu robots.txt + Crawl-delay, tu nhan dien KK-MALL-PriceBot. Ket qua luu GitHub Actions cache (khong commit),
# bo thu thap gia 3 gio/lan doc lai de dinh gia theo quy tac gia thuc tra + phi dich vu.
name: Retail price crawl (1h)
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # chi de goi chay bu bo thu thap gia (workflow_dispatch) khi lich cua GitHub bi tre
concurrency:
  group: retail-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Nap bo nho dem truoc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.retail-cache
          key: retail-${{ github.run_id }}
          restore-keys: retail-
      - name: Thu thap (150 phut, 3 trang song song)
        run: node collector/retail.js 150
      - name: Luu bo nho dem
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.retail-cache
          key: retail-${{ github.run_id }}
      - name: Bu lich - goi bo thu thap gia neu da qua 3 gio chua chay (lich hen gio cua GitHub thuong bi tre/bo luot)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          row=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect.yml --limit 1 --json createdAt,status -q '.[0] | "\(.createdAt) \(.status)"')
          created=${row%% *}; status=${row##* }
          [ -n "$created" ] || { echo "Khong doc duoc lan chay gan nhat"; exit 0; }
          age=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "Bo thu thap gia: lan gan nhat cach day $((age/60)) phut, trang thai $status"
          if [ "$status" = "completed" ] && [ "$age" -ge 10800 ]; then
            gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main -f trigger=bu-lich && echo "Da goi chay bu."
          fi
