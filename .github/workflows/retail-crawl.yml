# THU THAP GIA CONG KHAI WEBSITE BAN LE (Hoang Ha Mobile, Phuc Anh, An Phat) - moi gio, toi da 150 phut
# (An Phat yeu cau cach 5 giay/trang, ~14.000 trang: 45 phut/lan + lich GitHub thuc te chi chay 3-4 lan/ngay => 7,5 ngay moi het 1 vong,
#  gia cu hon han muc 7 ngay. 150 phut/lan => ~2 ngay/vong, van dung Crawl-delay cua tung website.)
# Tuan thu robots.txt + Crawl-delay, tu nhan dien KK-MALL-PriceBot. Ket qua luu GitHub Actions cache (khong commit),
# bo thu thap gia 3 gio/lan doc lai de dinh gia theo quy tac gia thuc tra + phi dich vu.
name: Retail price crawl (4h)
on:
  schedule:
    - cron: '41 */4 * * *'   # 1 luot ~150 phut moi 4 gio (ton trong website nguon); nhip that do collector/scheduler.js giu
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # dieu phoi lich: doc lan chay gan nhat + goi chay (workflow_dispatch) cac quy trinh den han
concurrency:
  group: retail-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Danh dau thoi diem bat dau (cho dieu phoi lich)
        run: date +%s > "$RUNNER_TEMP/kk-start"
      - name: Nap bo nho dem truoc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.retail-cache
          key: retail-${{ github.run_id }}
          restore-keys: retail-
      - name: Thu thap (150 phut, 3 trang song song)
        env:
          GH_TOKEN: ${{ github.token }}   # chi de goi chay bu bo thu thap gia khi lich cua GitHub tre (collector/kick.js)
        run: node collector/retail.js 150
      - name: Luu bo nho dem
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.retail-cache
          key: retail-${{ github.run_id }}
      - name: Dieu phoi lich - noi tiep vong chay va goi cac quy trinh den han (cron cua GitHub bo / tre phan lon luot)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KK_JOB_STATUS: ${{ job.status }}
          SEARCH_CHAIN: ${{ vars.SEARCH_CHAIN }}
          HUNT_VN_RUNNER: ${{ vars.HUNT_VN_RUNNER }}
        run: KK_RUN_START=$(cat "$RUNNER_TEMP/kk-start" 2>/dev/null || echo 0) node collector/scheduler.js --self retail-crawl.yml
