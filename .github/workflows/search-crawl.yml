# TIM GIA RE NHAT THEO TU KHOA TREN SAN (TikTok Shop qua AccessTrade; Shopee Affiliate Open API khi co khoa) - moi luot toi da 110 phut.
# NOI CHUOI: lich hen gio cua GitHub thuc te chi chay 5-7 gio/lan, nen moi luot chay xong se tu goi luot ke tiep (workflow_dispatch) - cron chi de khoi dong lai
# khi chuoi dut. Vi chay lien tuc nen nhip hoi chi 15 truy van/phut = MOT NUA gioi han chinh thuc 30 yeu cau/phut cua AccessTrade. Tat noi chuoi: bien SEARCH_CHAIN=0.
# Trong luc chay, tien trinh nay cung giu nhip 3 gio/lan cho bo thu thap gia (collector/kick.js).
# CHI dung API chinh thuc, co gioi han toc do (Shopee 2.000 truy van/gio) nen chay xoay vong:
# moi lan hoi ~1.600 san pham; uu tien lam moi san pham DANG co gia tu san, roi san pham chua kiem tra, roi kiem tra lau nhat. Ket qua luu GitHub Actions cache (khong commit -
# gia nguon la bi mat kinh doanh), bo thu thap gia 3 gio/lan doc lai va ghep bang bo ghep cheo truoc khi dung dinh gia.
name: Marketplace price search (1h)
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Ngan sach thoi gian (phut)'
        required: false
        default: '110'
permissions:
  contents: read
  actions: write   # chi de goi chay bu bo thu thap gia (workflow_dispatch) khi lich cua GitHub bi tre
concurrency:
  group: search-crawl
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Nap bo nho dem truoc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.search-cache
          key: search-${{ github.run_id }}
          restore-keys: search-
      - name: Tim gia theo tu khoa (xoay vong)
        env:
          ACCESSTRADE_KEY: ${{ secrets.ACCESSTRADE_KEY }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          SEARCH_TT_SORT: ${{ vars.SEARCH_TT_SORT || 'RECOMMENDED' }}
          SEARCH_TT_GAP_MS: ${{ vars.SEARCH_TT_GAP_MS || '4000' }}   # 15 truy van/phut (mot nua gioi han 30/phut cua doi tac) vi chay noi chuoi lien tuc
          GH_TOKEN: ${{ github.token }}                             # chi de goi chay bu bo thu thap gia (collector/kick.js)
        run: |
          date +%s > "$RUNNER_TEMP/kk-start"
          node collector/search.js ${{ github.event.inputs.minutes || '110' }}
      - name: Luu bo nho dem
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.search-cache
          key: search-${{ github.run_id }}
      - name: Bu lich - goi bo thu thap gia neu da qua 3 gio chua chay (lich hen gio cua GitHub thuong bi tre/bo luot)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          row=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect.yml --limit 1 --json createdAt,status -q '.[0] | "\(.createdAt) \(.status)"')
          created=${row%% *}; status=${row##* }
          [ -n "$created" ] || { echo "Khong doc duoc lan chay gan nhat"; exit 0; }
          age=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "Bo thu thap gia: lan gan nhat cach day $((age/60)) phut, trang thai $status"
          if [ "$status" = "completed" ] && [ "$age" -ge 10800 ]; then
            gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main -f trigger=bu-lich && echo "Da goi chay bu."
          fi
      - name: Noi chuoi - goi luot tim gia ke tiep (chi khi luot nay chay du >= 30 phut va chua co luot nao dang cho)
        if: success() && vars.SEARCH_CHAIN != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ran=$(( $(date +%s) - $(cat "$RUNNER_TEMP/kk-start" 2>/dev/null || date +%s) ))
          if [ "$ran" -lt 1800 ]; then echo "Luot nay chi chay $((ran/60)) phut (dung som) - khong noi chuoi, cho lich hen gio."; exit 0; fi
          wait=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow search-crawl.yml --limit 10 --json status -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$wait" = "0" ]; then gh workflow run search-crawl.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Da goi luot ke tiep."; else echo "Da co $wait luot dang cho - khong goi them."; fi
