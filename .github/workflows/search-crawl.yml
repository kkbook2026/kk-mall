# TIM GIA RE NHAT THEO TU KHOA TREN SAN (TikTok Shop qua AccessTrade; Shopee Affiliate Open API khi co khoa) - moi luot toi da 110 phut.
# NOI CHUOI: lich hen gio cua GitHub thuc te chi chay 5-7 gio/lan, nen moi luot chay xong buoc "Dieu phoi lich" (collector/scheduler.js) goi luot ke tiep
# va cac quy trinh den han - cron chi de khoi dong lai khi chuoi dut. Vi chay lien tuc nen nhip hoi chi 15 truy van/phut = MOT NUA gioi han chinh thuc 30 yeu cau/phut cua AccessTrade. Tat noi chuoi: bien SEARCH_CHAIN=0.
# Trong luc chay, tien trinh nay cung giu nhip 3 gio/lan cho bo thu thap gia (collector/kick.js).
# CHI dung API chinh thuc, co gioi han toc do (Shopee 2.000 truy van/gio) nen chay xoay vong:
# moi lan hoi ~1.600 san pham; uu tien lam moi san pham DANG co gia tu san, roi san pham chua kiem tra, roi kiem tra lau nhat. Ket qua luu GitHub Actions cache (khong commit -
# gia nguon la bi mat kinh doanh), bo thu thap gia 3 gio/lan doc lai va ghep bang bo ghep cheo truoc khi dung dinh gia.
name: Marketplace price search (lien tuc)
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Ngan sach thoi gian (phut)'
        required: false
        default: '110'
permissions:
  contents: read
  actions: write   # dieu phoi lich: doc lan chay gan nhat + goi chay (workflow_dispatch) cac quy trinh den han
concurrency:
  group: search-crawl
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Nap bo nho dem truoc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.search-cache
          key: search-${{ github.run_id }}
          restore-keys: search-
      - name: Tim gia theo tu khoa (xoay vong)
        env:
          ACCESSTRADE_KEY: ${{ secrets.ACCESSTRADE_KEY }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          SEARCH_TT_SORT: ${{ vars.SEARCH_TT_SORT || 'RECOMMENDED' }}
          SEARCH_TT_GAP_MS: ${{ vars.SEARCH_TT_GAP_MS || '4000' }}   # 15 truy van/phut (mot nua gioi han 30/phut cua doi tac) vi chay noi chuoi lien tuc
          GH_TOKEN: ${{ github.token }}                             # chi de goi chay bu bo thu thap gia (collector/kick.js)
        run: |
          date +%s > "$RUNNER_TEMP/kk-start"
          node collector/search.js ${{ github.event.inputs.minutes || '110' }}
      - name: Luu bo nho dem
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/.search-cache
          key: search-${{ github.run_id }}
      - name: Dieu phoi lich - noi tiep vong chay va goi cac quy trinh den han (cron cua GitHub bo / tre phan lon luot)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KK_JOB_STATUS: ${{ job.status }}
          SEARCH_CHAIN: ${{ vars.SEARCH_CHAIN }}
          HUNT_VN_RUNNER: ${{ vars.HUNT_VN_RUNNER }}
        run: KK_RUN_START=$(cat "$RUNNER_TEMP/kk-start" 2>/dev/null || echo 0) node collector/scheduler.js --self search-crawl.yml
